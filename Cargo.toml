[workspace]
members = [
    "kernel",
    # "crates/hal",
    # "crates/scheduler",
    # "crates/metrics",
    # "crates/sched-sim",
    # "arch-x86_64",
    # "arch-riscv64", 
]
resolver = "2"

[profile.dev]
panic = "abort"
lto = false
opt-level = 0
codegen-units = 16

[profile.release]
panic = "abort"
lto = "thin"
opt-level = "z"
codegen-units = 1
strip = true